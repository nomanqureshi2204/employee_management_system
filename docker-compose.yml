version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ems_db
    ports:
      - "3306:3306"
    restart: always

  eureka-server:
    image: eureka-server:1.0
    container_name: eureka-server
    ports:
      - "8761:8761"
    restart: always

  api-gateway:
    image: api-gateway:1.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    restart: always

  auth-service:
    image: auth-service:1.0
    container_name: auth-service
    ports:
      - "8081:8081"
    depends_on:
      - mysql
      - eureka-server
    restart: always

  employee-service:
    image: employee-service:1.0
    container_name: employee-service
    ports:
      - "8082:8080"
    depends_on:
      - mysql
      - eureka-server
    restart: always

  project-service:
    image: project-service:1.0
    container_name: project-service
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - eureka-server
    restart: always

  client-service:
    image: client-service:1.0
    container_name: client-service
    ports:
      - "8083:8084"
    depends_on:
      - eureka-server
    restart: always

  dashboard-service:
    image: dashboard-service:1.0
    container_name: dashboard-service
    ports:
      - "8085:8085"
    depends_on:
      - eureka-server
      - auth-service
      - employee-service
      - project-service
    restart: always