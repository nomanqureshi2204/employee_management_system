server:
  port: 8084

spring:
  application:
    name: CLIENT-SERVICE

  datasource:
    # 🔥 FIX: localhost CI/Docker me kaam nahi karta
    # mysql = GitHub Actions Docker service name
    url: jdbc:mysql://mysql:3306/ems_db

    # 🔥 FIX: CI MySQL credentials (same as GitHub Actions)
    username: root
    password: root

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # ⚠️ CI/testing me ok, production me careful
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      # 🔥 FIX: localhost works only on your system
      # CI/Docker me service name use hota hai
      defaultZone: http://eureka-server:8761/eureka/