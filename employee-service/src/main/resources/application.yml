server:
  port: 8082

jwt:
  # ⚠️ NOTE: secret same rakho across services (auth + employee etc.)
  secret: mysecretkeymysecretkeymysecretkey12

spring:
  application:
    name: EMPLOYEE-SERVICE

  datasource:
    # 🔥 FIX: localhost CI/Docker me work nahi karega
    url: jdbc:mysql://mysql:3306/ems_db

    # 🔥 FIX: CI MySQL credentials
    username: root
    password: root

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # ⚠️ CI/testing friendly (production me validate/update carefully)
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      # 🔥 FIX: Docker/Eureka service name use karo
      defaultZone: http://eureka-server:8761/eureka/