name: EMS CI Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify Environment
        run: |
          java -version
          mvn -version

      - name: Build & Test Auth Service
        run: mvn -f auth-service/pom.xml clean verify

      - name: Build & Test Project Service
        run: mvn -f project-service/pom.xml clean verify

      - name: Build & Test Employee Service
        run: mvn -f employee-service/pom.xml clean verify

      - name: Build & Test Client Service
        run: mvn -f client-service/pom.xml clean verify

      - name: Build & Test Dashboard Service
        run: mvn -f dashboard-service/pom.xml clean verify

      - name: Build & Test API Gateway
        run: mvn -f api-gateway/pom.xml clean verify

      - name: Build & Test Eureka Server
        run: mvn -f eureka-server/pom.xml clean verify