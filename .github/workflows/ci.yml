name: EMS CI Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Common Library
        run: mvn -f common-library/pom.xml clean install -DskipTests

      - name: Build Auth Service
        run: mvn -f auth-service/pom.xml clean install -DskipTests

      - name: Build Project Service
        run: mvn -f project-service/pom.xml clean install -DskipTests

      - name: Build Employee Service
        run: mvn -f employee-service/pom.xml clean install -DskipTests

      - name: Build Client Service
        run: mvn -f client-service/pom.xml clean install -DskipTests

      - name: Build Dashboard Service
        run: mvn -f dashboard-service/pom.xml clean install -DskipTests

      - name: Build Gateway
        run: mvn -f api-gateway/pom.xml clean install -DskipTests

      - name: Build Eureka
        run: mvn -f eureka-server/pom.xml clean install -DskipTests