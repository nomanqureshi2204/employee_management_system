name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1️⃣ FIRST BUILD COMMON LIBRARY
      - name: Build Common Library
        run: mvn -f common-library/pom.xml clean install -DskipTests

      # 2️⃣ AUTH SERVICE
      - name: Build Auth Service
        run: mvn -f auth-service/pom.xml clean install -DskipTests

      # 3️⃣ PROJECT SERVICE
      - name: Build Project Service
        run: mvn -f project-service/pom.xml clean install -DskipTests

      # 4️⃣ EUREKA SERVER
      - name: Build Eureka Server
        run: mvn -f eureka-server/pom.xml clean install -DskipTests