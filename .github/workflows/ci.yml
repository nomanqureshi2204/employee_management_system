name: EMS CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ems_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # =========================
      # 🔥 STEP 1: COMMON LIBRARY
      # =========================
      - name: Build Common Library
        run: mvn -f common-library/pom.xml clean install -DskipTests

      # =========================
      # 🔥 STEP 2: SERVICES BUILD (JAR)
      # =========================
      - name: Build Auth Service
        run: mvn -f auth-service/pom.xml clean package -DskipTests

      - name: Build Employee Service
        run: mvn -f employee-service/pom.xml clean package -DskipTests

      - name: Build Client Service
        run: mvn -f client-service/pom.xml clean package -DskipTests

      - name: Build Dashboard Service
        run: mvn -f dashboard-service/pom.xml clean package -DskipTests

      - name: Build API Gateway
        run: mvn -f api-gateway/pom.xml clean package -DskipTests

      - name: Build Eureka Server
        run: mvn -f eureka-server/pom.xml clean package -DskipTests

      - name: Build Project Service
        run: mvn -f project-service/pom.xml clean package -DskipTests

      # =========================
      # 🔥 STEP 3: DOCKER LOGIN
      # =========================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # 🐳 STEP 4: DOCKER BUILD + PUSH
      # =========================

      - name: Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:1.0 ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:1.0

      - name: Employee Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-service:1.0 ./employee-service
          docker push ${{ secrets.DOCKER_USERNAME }}/employee-service:1.0

      - name: Client Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/client-service:1.0 ./client-service
          docker push ${{ secrets.DOCKER_USERNAME }}/client-service:1.0

      - name: Dashboard Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dashboard-service:1.0 ./dashboard-service
          docker push ${{ secrets.DOCKER_USERNAME }}/dashboard-service:1.0

      - name: API Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:1.0 ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:1.0

      - name: Eureka Server
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eureka-server:1.0 ./eureka-server
          docker push ${{ secrets.DOCKER_USERNAME }}/eureka-server:1.0

      - name: Project Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/project-service:1.0 ./project-service
          docker push ${{ secrets.DOCKER_USERNAME }}/project-service:1.0