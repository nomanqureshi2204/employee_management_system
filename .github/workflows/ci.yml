name: EMS CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ems_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ❌ REMOVED MAVEN ROOT BUILD (this was causing your error)

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🔥 AUTH SERVICE
      - name: Build & Push Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/auth-service:1.0 ./auth-service
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:1.0

      # 🔥 EMPLOYEE SERVICE
      - name: Build & Push Employee Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-service:1.0 ./employee-service
          docker push ${{ secrets.DOCKER_USERNAME }}/employee-service:1.0

      # 🔥 CLIENT SERVICE
      - name: Build & Push Client Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/client-service:1.0 ./client-service
          docker push ${{ secrets.DOCKER_USERNAME }}/client-service:1.0

      # 🔥 DASHBOARD SERVICE
      - name: Build & Push Dashboard Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/dashboard-service:1.0 ./dashboard-service
          docker push ${{ secrets.DOCKER_USERNAME }}/dashboard-service:1.0

      # 🔥 API GATEWAY
      - name: Build & Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:1.0 ./api-gateway
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:1.0

      # 🔥 EUREKA SERVER
      - name: Build & Push Eureka Server
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/eureka-server:1.0 ./eureka-server
          docker push ${{ secrets.DOCKER_USERNAME }}/eureka-server:1.0

      # 🔥 PROJECT SERVICE
      - name: Build & Push Project Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/project-service:1.0 ./project-service
          docker push ${{ secrets.DOCKER_USERNAME }}/project-service:1.0