name: EMS CI Pipeline

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 🔥 MySQL container for all services
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ems_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Verify Environment
        run: |
          java -version
          mvn -version

      # 🔥 Wait for MySQL to be ready
      - name: Wait for MySQL
        run: sleep 25

      # 🔥 Build Common Library first
      - name: Build Common Library
        run: mvn -f common-library/pom.xml clean install -DskipTests

      # 🔥 Build all services (tests skipped)
      - name: Build Auth Service
        run: mvn -f auth-service/pom.xml clean package -DskipTests

      - name: Build Project Service
        run: mvn -f project-service/pom.xml clean package -DskipTests

      - name: Build Employee Service
        run: mvn -f employee-service/pom.xml clean package -DskipTests

      - name: Build Client Service
        run: mvn -f client-service/pom.xml clean package -DskipTests

      - name: Build Dashboard Service
        run: mvn -f dashboard-service/pom.xml clean package -DskipTests

      - name: Build API Gateway
        run: mvn -f api-gateway/pom.xml clean package -DskipTests

      - name: Build Eureka Server
        run: mvn -f eureka-server/pom.xml clean package -DskipTests