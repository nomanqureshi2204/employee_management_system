server:
  port: 8084

spring:
  application:
    name: CLIENT-SERVICE

  datasource:
    url: jdbc:mysql://mysql:3306/ems_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/